
<body>
    <div class="container">
        <div class="login-box">
            <h1 class="show_time">{{ currentTime | date: 'hh:mm:ss a' }}</h1>
            <h2>Login</h2>
            <form [formGroup]="form">
                <div class="input-box">
                    <input type="email" formControlName="email" required>
                    <label>Email</label>
                </div>
                <div *ngIf="form.controls['email']?.invalid && form.controls['email']?.touched">
                    <p style="color: #00eeff;">Email is required!</p>
                </div>
                <div class="input-box">
                    <input type="password" formControlName="password" required>
                    <label>Password</label>
                </div>
                <div *ngIf="form.controls['password']?.invalid && form.controls['password']?.touched">
                    <p style="color: #00eeff;">Password is required!</p>
                </div>
                <div class="forgot-pass">
                    <a href="javaScript:void(0)">Forgot your password?</a>
                </div>
                <button type="button" (click)="submitForm(form)" class="btn">Login</button>
                <div class="signup-link">
                    <a href="javaScript:void(0)">Signup</a>
                </div>
            </form>
        </div>
